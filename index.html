<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>तालुका पोर्टल बंद | जिल्हा पोर्टलवर पुनर्निर्देशन</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sky: #0284c7;
      --sky-dark: #0369a1;
      --kesari: #ea580c;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .notice-card {
      background: var(--surface);
      max-width: 520px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
      border-top: 6px solid var(--danger);
      padding: 32px 24px;
      text-align: center;
    }

    .alert-icon {
      width: 64px;
      height: 64px;
      background: #fee2e2;
      color: var(--danger);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 16px;
    }

    .notice-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #991b1b;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .notice-desc {
      font-size: 1.05rem;
      color: #334155;
      line-height: 1.6;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .notice-desc strong {
      color: var(--sky-dark);
      font-weight: 800;
    }

    .timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px 0 20px 0;
    }

    .countdown-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #f0f9ff;
      border: 3.5px solid var(--sky);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      font-family: 'Poppins', sans-serif;
      color: var(--sky-dark);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
      margin-bottom: 8px;
    }

    .redirect-note {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .btn-redirect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      transition: all 0.2s;
    }

    .btn-redirect:active {
      transform: scale(0.98);
      background: var(--sky-dark);
    }
  </style>
</head>
<body>

<div class="notice-card">
  <div class="alert-icon">
    <i class="fa-solid fa-ban"></i>
  </div>

  <h2 class="notice-title">तालुका पोर्टल बंद करण्यात आले आहे</h2>
  
  <p class="notice-desc">
    सर्व शाळांसाठी तालुका पोर्टल आता बंद करण्यात आले असून, यापुढे सर्व सराव परीक्षांचे गुण थेट <strong>जिल्हा परिषद बीड</strong> यांच्या अधिकृत <strong>जिल्हा पोर्टलवर</strong> नोंदवायचे आहेत.
  </p>

  <div class="timer-wrap">
    <div class="countdown-circle" id="countdown">5</div>
    <p class="redirect-note">सेकंदात जिल्हा पोर्टल सुरू होत आहे...</p>
  </div>

  <a id="btnGoDistrict" href="https://padmakarshinde043-byte.github.io/TEST-DATABASE/" class="btn-redirect">
    <span>आत्ताच जिल्हा पोर्टल उघडा</span>
    <i class="fa-solid fa-arrow-right"></i>
  </a>
</div>

<script>
  // जिल्हा पोर्टलची लिंक
  const DISTRICT_PORTAL_URL = "https://padmakarshinde043-byte.github.io/TEST-DATABASE/";
  
  document.getElementById("btnGoDistrict").href = DISTRICT_PORTAL_URL;

  let timeLeft = 5;
  const countEl = document.getElementById("countdown");

  const timer = setInterval(() => {
    timeLeft--;
    if (timeLeft >= 0) {
      countEl.textContent = timeLeft;
    }
    if (timeLeft <= 0) {
      clearInterval(timer);
      window.location.replace(DISTRICT_PORTAL_URL);
    }
  }, 1000);
</script>

</body>
</html>
